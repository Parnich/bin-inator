[package]
name = "bin-inator"
version = "0.1.0"
edition = "2024"
description = "Convert anything into .bin files"
license = "MIT"
default-run = "bin-inator-gui"

[lib]
name = "bin_inator"
path = "src/lib.rs"

[[bin]]
name = "bin-inator"
path = "src/bin/bin-inator.rs"

[[bin]]
name = "bin-inator-gui"
path = "src/bin/bin-inator-gui.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
directories = "6"
eframe = "0.37"
encoding_rs = "0.8"
image = "0.25"
infer = "0.22"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
